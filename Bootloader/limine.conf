# Force Full HD in both the Limine interface and the framebuffer handed to ZonderqOS.
# On UEFI/GOP targets the kernel inherits the mode selected by Limine.
timeout: 5
interface_resolution: 1920x1080

/ZonderqOS
    protocol: limine

    # Request a 32-bit 1920x1080 framebuffer for the kernel.
    # If firmware does not expose this GOP mode, Limine will fall back automatically.
    resolution: 1920x1080x32

    # boot():/ represents the partition on which limine.conf is located.
    path: boot():/boot/ZonderqOS.elf
