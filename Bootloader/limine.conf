# Cosmos Gen3 v3.0.95 / Limine v10 A/B dual-slot boot configuration.
# Default timeout in seconds before booting the selected entry.
timeout: 5
default_entry: 1

/ZonderqOS (Slot A)
    protocol: limine
    resolution: 1366x768x32
    path: fslabel(ZONDERQDATA):/boot/slot_a/ZonderqOS.elf

/ZonderqOS (Slot B)
    protocol: limine
    resolution: 1366x768x32
    path: fslabel(ZONDERQDATA):/boot/slot_b/ZonderqOS.elf

/ZonderqOS (Kopia zapasowa ISO / Ratunkowa)
    protocol: limine
    resolution: 1366x768x32
    path: boot():/boot/ZonderqOS.elf
