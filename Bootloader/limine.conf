# Give UEFI/GOP targets (including Raspberry Pi 4) a visible boot menu before launching.
timeout: 5

/ZonderqOS
    protocol: limine

    # Do not force a framebuffer resolution here. On real UEFI hardware such as
    # Raspberry Pi 4, Limine should keep/use a GOP mode exposed by the firmware.
    # A hard-coded 1920x1080x32 mode works in QEMU but can leave real hardware black.

    # boot():/ represents the partition on which limine.conf is located.
    path: boot():/boot/ZonderqOS.elf
