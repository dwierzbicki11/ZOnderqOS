# Cosmos Gen3 v3.0.94 / Limine v10 boot configuration.
# Request the laptop's 1366x768 (HD/768p) panel mode at the BOOTLOADER,
# before the firmware framebuffer is handed to the kernel. This is not a
# fabricated GUI Canvas size: Limine falls back to an available video mode
# automatically when the requested mode is unsupported by BIOS/VBE or UEFI/GOP.
# The request applies to the booted OS, not just to the boot menu.
timeout: 5

/ZonderqOS
    protocol: limine
    # The panel is 1366x768, not 800x600. A mode request is best-effort;
    # UEFI boot may expose more GOP modes than Legacy/CSM.
    resolution: 1366x768x32
    path: boot():/boot/ZonderqOS.elf
