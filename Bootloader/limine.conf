# Prefer the firmware's native framebuffer mode on physical hardware.
# Do not force 1920x1080: many laptops expose a 1366x768 GOP framebuffer,
# and an unsupported or scaled mode can make early panic logs unreadable.
timeout: 5

/ZonderqOS
    protocol: limine

    # No forced resolution: let Limine select a firmware-supported mode.
    # boot():/ represents the partition containing limine.conf.
    path: boot():/boot/ZonderqOS.elf
