# Keep a short visible boot menu on UEFI/GOP targets, including QEMU ramfb.
timeout: 5

/ZonderqOS
    protocol: limine

    # Do not force a framebuffer resolution. Let the active UEFI/GOP firmware
    # choose a mode that Limine can keep for the kernel console.

    # boot():/ represents the partition on which limine.conf is located.
    path: boot():/boot/ZonderqOS.elf
