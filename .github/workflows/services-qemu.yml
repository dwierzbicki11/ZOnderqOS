name: Configured services persistent QEMU boot (stock Cosmos 3.0.95)

on:
  pull_request:
    paths:
      - 'source/Core/Services/**'
      - 'source/Core/SystemIdentity.cs'
      - 'source/Storage/Disk.cs'
      - 'Kernel.cs'
      - 'ZonderqOS.csproj'
      - 'tools/build-cosmos-3095-local.sh'
      - 'tools/smoke-services-qemu.sh'
      - '.github/workflows/services-qemu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  persistent-fat-boot:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install exact-tag Cosmos, QEMU and FAT build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 tar clang lld nasm xorriso binutils \
            qemu-system-x86 fdisk dosfstools mtools
      - name: Validate unpatched upstream runtime
        run: |
          set -euo pipefail
          bash run.sh --check
          bash -n tools/smoke-services-qemu.sh
      - name: Build stock v3.0.95 disk-backed ISO (no Stage23 patches)
        env:
          ZONDERQ_3095_WORK_DIR: ${{ runner.temp }}/zonderqos-cosmos-3095
        run: |
          bash tools/build-cosmos-3095-local.sh disk
          test -s output-3095/ZonderqOS-3095-disk.iso
      - name: Boot twice with one dedicated ZONDERQDATA FAT32 image (1 vCPU)
        env:
          SERVICE_QEMU_BOOT_SECONDS: '100'
          SERVICE_QEMU_CAPTURE_SCREEN: '1'
        run: |
          bash tools/smoke-services-qemu.sh \
            output-3095/ZonderqOS-3095-disk.iso services-qemu-output \
            2>&1 | tee services-qemu-smoke.log
      - name: Diagnostics
        if: always()
        run: |
          cat services-qemu-smoke.log 2>/dev/null || true
          tail -n 150 services-qemu-output/first.serial.log services-qemu-output/second.serial.log 2>/dev/null || true
          cat services-qemu-output/first.stderr.log services-qemu-output/second.stderr.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: services-3095-stock-persistent-qemu-diagnostics
          if-no-files-found: ignore
          path: |
            services-qemu-smoke.log
            services-qemu-output/*.log
            services-qemu-output/*.conf
            services-qemu-output/*.ppm
