name: Gen3 Network 3.0.97 main-port host smoke
on:
  push:
    branches: [feat/3097-network-main-port]
  pull_request:
    paths:
      - 'source/Hardware/E1000EPciIdentity.cs'
      - 'source/Hardware/PciBarInventory.cs'
      - 'source/Hardware/Realtek810xERegisterSnapshot.cs'
      - 'tests/Gen3NetworkMainSmoke/**'
      - '.github/workflows/gen3-network-main-port.yml'
jobs:
  host-network:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/Gen3NetworkMainSmoke/Gen3NetworkMainSmoke.csproj -c Release
