name: Cosmos 3.0.94 SMP port stage 4

on:
  pull_request:
    paths:
      - 'patches/cosmos-3094/**'
      - 'tools/check-cosmos-3094-stage1.sh'
      - '.github/workflows/cosmos-3094-stage4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage4:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with: { path: zonderq }
      - uses: actions/checkout@v4
        with:
          repository: CosmosOS/Cosmos
          ref: v3.0.94
          path: cosmos
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Apply stages 1–4 to isolated Cosmos v3.0.94
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: |
          set -euo pipefail
          bash zonderq/tools/check-cosmos-3094-stage1.sh --apply
          for number in 0002 0003 0004; do
            patch="$(find zonderq/patches/cosmos-3094 -maxdepth 1 -name "${number}-*.patch" -print -quit)"
            test -n "$patch"
            git -C cosmos apply --check "../$patch"
            git -C cosmos apply "../$patch"
            echo "[SMP3094] Stage $number applied"
          done
          git -C cosmos diff --check
          git -C cosmos apply --reverse --check ../zonderq/patches/cosmos-3094/0004-ap-bootstrap-parked.patch
      - name: Assemble native AP bootstrap and verify exports
        run: |
          sed -E 's,//.*$,,' cosmos/src/Cosmos.Kernel.Native.X64/CPU/Interrupts.s | as --64 -o /tmp/smp3094-stage4.o -
          for symbol in _native_x64_start_aps _native_x64_ap_entry _native_x64_get_ap_ready _native_x64_get_ap_lapic_id _native_x64_get_ap_gs_id _native_x64_get_ap_stack _native_x64_get_ap_rflags; do
            nm -g /tmp/smp3094-stage4.o | grep -Fq "$symbol"
          done
      - name: Compile patched x64 Core + HAL
        working-directory: cosmos
        run: |
          dotnet build src/Cosmos.Kernel.Core/Cosmos.Kernel.Core.csproj -c Release -r linux-x64 -p:CosmosArch=x64 -p:GeneratePackageOnBuild=false --nologo
          dotnet build src/Cosmos.Kernel.HAL.X64/Cosmos.Kernel.HAL.X64.csproj -c Release -r linux-x64 -p:CosmosArch=x64 -p:GeneratePackageOnBuild=false --nologo
      - name: ARM64 compile regression
        working-directory: cosmos
        run: |
          rm -rf src/Cosmos.Kernel.Core/obj src/Cosmos.Kernel.Core/bin
          dotnet build src/Cosmos.Kernel.Core/Cosmos.Kernel.Core.csproj -c Release -r linux-arm64 -p:CosmosArch=arm64 -p:GeneratePackageOnBuild=false --nologo
          dotnet build src/Cosmos.Kernel.HAL.ARM64/Cosmos.Kernel.HAL.ARM64.csproj -c Release -r linux-arm64 -p:CosmosArch=arm64 -p:GeneratePackageOnBuild=false --nologo
