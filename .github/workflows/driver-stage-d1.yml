name: Driver stage D1 device model

on:
  push:
    branches: [ drivers/d1-device-pci ]
    paths: [ 'source/Hardware/**', 'source/Platform/X64/PciConfigIoAccessor.cs', 'tests/HardwareModel.Tests/**', '.github/workflows/driver-stage-d1.yml' ]
  pull_request:
    paths: [ 'source/Hardware/**', 'source/Platform/X64/PciConfigIoAccessor.cs', 'tests/HardwareModel.Tests/**', '.github/workflows/driver-stage-d1.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  device-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run deterministic device and PCI model regression tests
        run: dotnet run --project tests/HardwareModel.Tests/HardwareModel.Tests.csproj -c Release
      - name: Verify privileged x64 backend uses the tested mechanism-1 codec
        run: |
          grep -Fq 'PciConfigMechanism1.EncodeAddress' source/Platform/X64/PciConfigIoAccessor.cs
          grep -Fq 'PciConfigMechanism1.Extract8' source/Platform/X64/PciConfigIoAccessor.cs
          grep -Fq 'PciConfigMechanism1.Extract16' source/Platform/X64/PciConfigIoAccessor.cs
          grep -Fq 'PlatformHAL.PortIO.WriteDWord(ConfigAddressPort, address)' source/Platform/X64/PciConfigIoAccessor.cs
          grep -Fq 'PlatformHAL.PortIO.ReadDWord(ConfigDataPort)' source/Platform/X64/PciConfigIoAccessor.cs
