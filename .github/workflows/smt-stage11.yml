name: SMT stage 11 real OrionGC stop-the-world integration

on:
  push:
    branches: [ main ]
    paths: [ 'patches/cosmos-smt/**', 'tools/prepare-cosmos-smt.sh', 'tools/smoke-stage11-qemu.sh', 'tools/verify-smt-local.sh', 'ZonderqOS.csproj', 'NuGet.Config', 'Bootloader/limine.conf', 'source/**', '.github/workflows/smt-stage11.yml' ]
  pull_request:
    paths: [ 'patches/cosmos-smt/**', 'tools/prepare-cosmos-smt.sh', 'tools/smoke-stage11-qemu.sh', 'ZonderqOS.csproj', 'NuGet.Config', 'Bootloader/limine.conf', 'source/**', '.github/workflows/smt-stage11.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-stage11:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpus: 1
            cores: 1
            threads: 1
          - cpus: 8
            cores: 4
            threads: 2
    steps:
      - uses: actions/checkout@v4
        with: { path: zonderq }
      - uses: actions/checkout@v4
        with:
          repository: CosmosOS/Cosmos
          ref: v3.0.85
          path: cosmos
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Install native toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 lld xorriso nasm
          qemu-system-x86_64 --version
      - name: Validate and apply Stage 11
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: |
          set -o pipefail
          bash -n zonderq/tools/prepare-cosmos-smt.sh
          bash -n zonderq/tools/smoke-stage11-qemu.sh
          bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 11 --check-only 2>&1 | tee zonderq/stage11-preflight.log
          bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 11 --patch-only 2>&1 | tee zonderq/stage11-apply.log
          git -C cosmos diff --check
          git -C zonderq rev-parse HEAD > zonderq/stage11-revisions.log
          git -C cosmos rev-parse HEAD >> zonderq/stage11-revisions.log
          git -C cosmos diff --stat >> zonderq/stage11-revisions.log
      - name: Verify idempotence and build clean patched Cosmos packages
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: |
          set -o pipefail
          bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 11 2>&1 | tee zonderq/stage11-packages.log
      - name: ARM64 managed HAL regression compile
        if: matrix.cpus == 1
        working-directory: cosmos
        run: |
          set -o pipefail
          dotnet build src/Cosmos.Kernel.HAL/Cosmos.Kernel.HAL.csproj \
            -c Release -r linux-arm64 -p:CosmosArch=arm64 \
            -p:GeneratePackageOnBuild=false --no-incremental 2>&1 | tee ../zonderq/stage11-arm64-hal.log
          dotnet build src/Cosmos.Kernel.HAL.ARM64/Cosmos.Kernel.HAL.ARM64.csproj \
            -c Release -r linux-arm64 -p:CosmosArch=arm64 \
            -p:GeneratePackageOnBuild=false --no-incremental 2>&1 | tee ../zonderq/stage11-arm64-platform.log
          echo 'ARM64 managed compile only; no ARM64 ISO boot/runtime claim.'
      - name: Force local patched Cosmos packages
        run: |
          cat > zonderq/NuGet.Config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources><clear /><add key="local-cosmos" value="${{ github.workspace }}/cosmos/artifacts/package/release" /><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources>
            <packageSourceMapping><packageSource key="local-cosmos"><package pattern="Cosmos.*" /></packageSource><packageSource key="nuget.org"><package pattern="*" /></packageSource></packageSourceMapping>
          </configuration>
          EOF
          mkdir -p "${{ runner.temp }}/zonderq-stage11-packages"
          test -z "$(ls -A "${{ runner.temp }}/zonderq-stage11-packages")"
      - name: Build real ZonderqOS x64 ISO
        working-directory: zonderq
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/zonderq-stage11-packages
          LOCAL_COSMOS_FEED: ${{ github.workspace }}/cosmos/artifacts/package/release
        run: |
          set -o pipefail
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet restore ZonderqOS.csproj -r linux-x64 -p:CosmosArch=x64 --configfile NuGet.Config --force --no-cache 2>&1 | tee stage11-restore.log
          python3 - <<'PY' | tee stage11-package-sources.log
          import json
          import os
          import pathlib

          cache = pathlib.Path(os.environ['NUGET_PACKAGES'])
          feed = pathlib.Path(os.environ['LOCAL_COSMOS_FEED']).resolve()
          required = {'cosmos.sdk', 'cosmos.kernel', 'cosmos.kernel.core', 'cosmos.kernel.core.x64', 'cosmos.kernel.hal', 'cosmos.kernel.hal.x64', 'cosmos.kernel.native.x64', 'cosmos.kernel.boot.limine'}
          found = set()
          for metadata in sorted(cache.glob('cosmos.*/3.0.85/.nupkg.metadata')):
              package = metadata.parent.parent.name
              source = json.loads(metadata.read_text())['source']
              if pathlib.Path(source).resolve() != feed:
                  raise SystemExit(f'[SMT11-CI][FAIL] {package} restored from {source}, expected {feed}')
              found.add(package)
              print(f'{package} 3.0.85: {source}')
          if required - found:
              raise SystemExit(f'[SMT11-CI][FAIL] missing local package metadata: {sorted(required - found)}')
          PY
          cosmos build -a x64 -v 2>&1 | tee stage11-build.log
          test -s output-x64/ZonderqOS.iso
          sha256sum output-x64/ZonderqOS.iso | tee stage11-iso.sha256
      - name: QEMU real OrionGC stop-the-world integration and 30-second stability
        working-directory: zonderq
        env:
          STAGE11_QEMU_CPU_MODEL: Nehalem
          STAGE11_QEMU_SOCKETS: 1
          STAGE11_QEMU_CPUS: ${{ matrix.cpus }}
          STAGE11_QEMU_CORES: ${{ matrix.cores }}
          STAGE11_QEMU_THREADS: ${{ matrix.threads }}
          STAGE11_QEMU_TIMEOUT_SECONDS: 90
          STAGE11_QEMU_STABLE_SECONDS: 30
        run: |
          set -o pipefail
          bash tools/smoke-stage11-qemu.sh output-x64/ZonderqOS.iso stage11-qemu-serial.log 2>&1 | tee stage11-smoke.log
      - name: Diagnostics
        if: always()
        working-directory: zonderq
        run: |
          tail -n 250 stage11-build.log 2>/dev/null || true
          cat stage11-qemu-serial.log stage11-qemu-serial.log.stderr 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage11-diagnostics-Nehalem-${{ matrix.cpus }}cpu
          if-no-files-found: ignore
          path: |
            zonderq/stage11-*.log
            zonderq/stage11-qemu-serial.log.stderr
            zonderq/stage11-iso.sha256
