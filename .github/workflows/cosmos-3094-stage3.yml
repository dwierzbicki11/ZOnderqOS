name: Cosmos 3.0.94 SMP port stage 3
on:
  pull_request:
    paths:
      - 'patches/cosmos-3094/**'
      - '.github/workflows/cosmos-3094-stage3.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage3:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { path: zonderq }
      - uses: actions/checkout@v4
        with:
          repository: CosmosOS/Cosmos
          ref: v3.0.94
          path: cosmos
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Apply isolated 3.0.94 stages 1-3
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: |
          bash zonderq/tools/check-cosmos-3094-stage1.sh --apply
          for n in 0002 0003; do
            patch="$(find zonderq/patches/cosmos-3094 -maxdepth 1 -name "${n}-*.patch" -print -quit)"
            test -n "$patch"
            git -C cosmos apply --check "../$patch"
            git -C cosmos apply "../$patch"
          done
          git -C cosmos diff --check
      - name: Validate native assembler and exports
        run: |
          sed -E 's,//.*$,,' cosmos/src/Cosmos.Kernel.Native.X64/CPU/Interrupts.s | as --64 -o /tmp/smp3094-stage3.o -
          nm /tmp/smp3094-stage3.o | grep -Fq '_native_x64_init_percpu'
          nm /tmp/smp3094-stage3.o | grep -Fq '_native_x64_smp3094_ap_stack_top'
      - name: Compile Cosmos 3.0.94 x64 Core + HAL
        working-directory: cosmos
        run: |
          dotnet build src/Cosmos.Kernel.Core/Cosmos.Kernel.Core.csproj -c Release -r linux-x64 -p:CosmosArch=x64 -p:GeneratePackageOnBuild=false --nologo
          dotnet build src/Cosmos.Kernel.HAL.X64/Cosmos.Kernel.HAL.X64.csproj -c Release -r linux-x64 -p:CosmosArch=x64 -p:GeneratePackageOnBuild=false --nologo
      - name: Compile Cosmos 3.0.94 ARM64 Core + HAL
        working-directory: cosmos
        run: |
          rm -rf src/Cosmos.Kernel.Core/obj src/Cosmos.Kernel.Core/bin
          dotnet build src/Cosmos.Kernel.Core/Cosmos.Kernel.Core.csproj -c Release -r linux-arm64 -p:CosmosArch=arm64 -p:GeneratePackageOnBuild=false --nologo
          dotnet build src/Cosmos.Kernel.HAL.ARM64/Cosmos.Kernel.HAL.ARM64.csproj -c Release -r linux-arm64 -p:CosmosArch=arm64 -p:GeneratePackageOnBuild=false --nologo
