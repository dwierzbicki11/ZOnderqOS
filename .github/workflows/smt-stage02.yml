name: SMT stage 2 validation

on:
  push:
    branches: [ main ]
    paths:
      - 'patches/cosmos-smt/**'
      - 'tools/prepare-cosmos-smt.sh'
      - '.github/workflows/smt-stage02.yml'
  pull_request:
    paths:
      - 'patches/cosmos-smt/**'
      - 'tools/prepare-cosmos-smt.sh'
      - '.github/workflows/smt-stage02.yml'

jobs:
  validate-stage02:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout ZonderqOS
        uses: actions/checkout@v4
        with:
          path: zonderq

      - name: Checkout pinned Cosmos 3.0.85
        uses: actions/checkout@v4
        with:
          repository: CosmosOS/Cosmos
          ref: v3.0.85
          path: cosmos
          submodules: recursive

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Preflight stages 1-2
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 2 --check-only

      - name: Apply stages 1-2
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 2 --patch-only

      - name: Verify dense CPU identity and stage isolation
        run: |
          git -C cosmos diff --check
          test -f cosmos/src/Cosmos.Kernel.Core/Scheduler/CpuIdentity.cs
          grep -Fq 'GetCurrentHardwareCpuId' cosmos/src/Cosmos.Kernel.Core/Scheduler/CpuIdentity.cs
          grep -Fq 'map[(int)cpu->LapicId] = nextCpuIndex++;' cosmos/src/Cosmos.Kernel.Core/Scheduler/CpuIdentity.cs
          grep -Fq 'SchedulerManager.GetCurrentCpuId()' cosmos/src/Cosmos.Kernel.Core.X64/Cpu/LocalApic.cs
          grep -Fq '_native_get_hardware_cpu_id' cosmos/src/Cosmos.Kernel.Native.X64/CPU/Interrupts.s
          grep -Fq '_context_switch_target_rsp: .zero 8' cosmos/src/Cosmos.Kernel.Native.X64/CPU/Interrupts.s
          ! grep -Fq '_context_switch_target_rsp: .zero 2048' cosmos/src/Cosmos.Kernel.Native.X64/CPU/Interrupts.s

      - name: Build patched x64 HAL
        working-directory: cosmos
        run: >-
          dotnet build src/Cosmos.Kernel.HAL.X64/Cosmos.Kernel.HAL.X64.csproj
          -c Release
          -r linux-x64
          -p:CosmosArch=x64
          -p:GeneratePackageOnBuild=false
          --no-incremental

      - name: Build patched ARM64 core compatibility
        working-directory: cosmos
        run: >-
          dotnet build src/Cosmos.Kernel.Core.ARM64/Cosmos.Kernel.Core.ARM64.csproj
          -c Release
          -r linux-arm64
          -p:CosmosArch=arm64
          -p:GeneratePackageOnBuild=false
          --no-incremental
