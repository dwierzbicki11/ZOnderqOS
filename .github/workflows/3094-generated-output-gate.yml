name: Cosmos 3.0.94 Roslyn generated-source compile gate

on:
  pull_request:
    paths:
      - 'Directory.Build.targets'
      - 'tests/test_3094_generated_output_dirs.py'
      - '.github/workflows/3094-generated-output-gate.yml'
  push:
    branches: [main]
    paths:
      - 'Directory.Build.targets'
      - 'tests/test_3094_generated_output_dirs.py'
      - '.github/workflows/3094-generated-output-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-output:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check Cosmos 3.0.94 and generated directory target
        run: |
          bash tools/verify-cosmos-compat.sh
          python3 tests/test_3094_generated_output_dirs.py
      - name: Compile x64 with actual Cosmos source generators
        run: |
          dotnet restore ZonderqOS.csproj -r linux-x64 -p:CosmosArch=x64 --force --no-cache
          dotnet msbuild ZonderqOS.csproj -t:Compile -p:Configuration=Release -p:RuntimeIdentifier=linux-x64 -p:CosmosArch=x64 -p:GeneratePackageOnBuild=false
      - name: Clean architecture outputs
        run: rm -rf bin obj
      - name: Compile ARM64
        run: |
          dotnet restore ZonderqOS.csproj -r linux-arm64 -p:CosmosArch=arm64 --force --no-cache
          dotnet msbuild ZonderqOS.csproj -t:Compile -p:Configuration=Release -p:RuntimeIdentifier=linux-arm64 -p:CosmosArch=arm64 -p:GeneratePackageOnBuild=false
