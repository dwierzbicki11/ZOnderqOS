name: SMT stage 17 AP timer preemption

on:
  push:
    branches: [ main ]
    paths: [ 'patches/cosmos-smt/**', 'tools/prepare-cosmos-smt.sh', 'tools/smoke-stage14-qemu.sh', 'tools/smoke-stage17-qemu.sh', 'tools/verify-smt-local.sh', 'ZonderqOS.csproj', 'NuGet.Config', 'Bootloader/limine.conf', 'source/**', '.github/workflows/smt-stage17.yml' ]
  pull_request:
    paths: [ 'patches/cosmos-smt/**', 'tools/prepare-cosmos-smt.sh', 'tools/smoke-stage14-qemu.sh', 'tools/smoke-stage17-qemu.sh', 'tools/verify-smt-local.sh', 'ZonderqOS.csproj', 'NuGet.Config', 'Bootloader/limine.conf', 'source/**', '.github/workflows/smt-stage17.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-stage17:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpus: 1
            cores: 1
            threads: 1
          - cpus: 8
            cores: 4
            threads: 2
    steps:
      - uses: actions/checkout@v4
        with: { path: zonderq }
      - uses: actions/checkout@v4
        with:
          repository: CosmosOS/Cosmos
          ref: v3.0.85
          path: cosmos
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Install native toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 lld xorriso nasm binutils
          qemu-system-x86_64 --version
      - name: Validate and apply Stage 17
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: |
          set -o pipefail
          bash -n zonderq/tools/prepare-cosmos-smt.sh
          bash -n zonderq/tools/smoke-stage14-qemu.sh
          bash -n zonderq/tools/smoke-stage17-qemu.sh
          bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 17 --check-only 2>&1 | tee zonderq/stage17-preflight.log
          bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 17 --patch-only 2>&1 | tee zonderq/stage17-apply.log
          git -C cosmos apply --reverse --check ../zonderq/patches/cosmos-smt/0017-ap-timer-preemption.patch
          sed -E 's,//.*$,,' cosmos/src/Cosmos.Kernel.Native.X64/CPU/Interrupts.s | as --64 -o /tmp/stage17-interrupts.o -
          git -C cosmos diff --check
          git -C zonderq rev-parse HEAD > zonderq/stage17-revisions.log
          git -C cosmos rev-parse HEAD >> zonderq/stage17-revisions.log
          git -C cosmos diff --stat >> zonderq/stage17-revisions.log
      - name: Verify idempotence and build clean patched Cosmos packages
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: |
          set -o pipefail
          bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 17 2>&1 | tee zonderq/stage17-packages.log
      - name: ARM64 managed regression compile
        if: matrix.cpus == 1
        working-directory: cosmos
        run: |
          set -o pipefail
          dotnet build src/Cosmos.Kernel.HAL/Cosmos.Kernel.HAL.csproj \
            -c Release -r linux-arm64 -p:CosmosArch=arm64 \
            -p:GeneratePackageOnBuild=false --no-incremental 2>&1 | tee ../zonderq/stage17-arm64-hal.log
          dotnet build src/Cosmos.Kernel.HAL.ARM64/Cosmos.Kernel.HAL.ARM64.csproj \
            -c Release -r linux-arm64 -p:CosmosArch=arm64 \
            -p:GeneratePackageOnBuild=false --no-incremental 2>&1 | tee ../zonderq/stage17-arm64-platform.log
          echo 'ARM64 managed compile only; no ARM64 SMP/runtime claim.'
      - name: Force local patched Cosmos packages
        run: |
          cat > zonderq/NuGet.Config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources><clear /><add key="local-cosmos" value="${{ github.workspace }}/cosmos/artifacts/package/release" /><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources>
            <packageSourceMapping><packageSource key="local-cosmos"><package pattern="Cosmos.*" /></packageSource><packageSource key="nuget.org"><package pattern="*" /></packageSource></packageSourceMapping>
          </configuration>
          EOF
          mkdir -p "${{ runner.temp }}/zonderq-stage17-packages"
          test -z "$(ls -A "${{ runner.temp }}/zonderq-stage17-packages")"
      - name: Build real ZonderqOS x64 ISO
        working-directory: zonderq
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/zonderq-stage17-packages
          LOCAL_COSMOS_FEED: ${{ github.workspace }}/cosmos/artifacts/package/release
        run: |
          set -o pipefail
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet restore ZonderqOS.csproj -r linux-x64 -p:CosmosArch=x64 --configfile NuGet.Config --force --no-cache 2>&1 | tee stage17-restore.log
          python3 - <<'PY' | tee stage17-package-sources.log
          import json
          import os
          import pathlib

          cache = pathlib.Path(os.environ['NUGET_PACKAGES'])
          feed = pathlib.Path(os.environ['LOCAL_COSMOS_FEED']).resolve()
          required = {'cosmos.sdk', 'cosmos.kernel', 'cosmos.kernel.core', 'cosmos.kernel.core.x64', 'cosmos.kernel.hal', 'cosmos.kernel.hal.x64', 'cosmos.kernel.native.x64', 'cosmos.kernel.boot.limine'}
          found = set()
          for metadata in sorted(cache.glob('cosmos.*/3.0.85/.nupkg.metadata')):
              package = metadata.parent.parent.name
              source = json.loads(metadata.read_text())['source']
              if pathlib.Path(source).resolve() != feed:
                  raise SystemExit(f'[SMT17-CI][FAIL] {package} restored from {source}, expected {feed}')
              found.add(package)
              print(f'{package} 3.0.85: {source}')
          if required - found:
              raise SystemExit(f'[SMT17-CI][FAIL] missing local package metadata: {sorted(required - found)}')
          PY
          cosmos build -a x64 -v 2>&1 | tee stage17-build.log
          test -s output-x64/ZonderqOS.iso
          sha256sum output-x64/ZonderqOS.iso | tee stage17-iso.sha256
      - name: QEMU Stage 14-16 regression plus Stage 17 AP timer preemption
        working-directory: zonderq
        env:
          STAGE17_QEMU_CPU_MODEL: Nehalem
          STAGE17_QEMU_SOCKETS: 1
          STAGE17_QEMU_CPUS: ${{ matrix.cpus }}
          STAGE17_QEMU_CORES: ${{ matrix.cores }}
          STAGE17_QEMU_THREADS: ${{ matrix.threads }}
          STAGE17_QEMU_TIMEOUT_SECONDS: 90
          STAGE17_QEMU_STABLE_SECONDS: 30
        run: |
          set -o pipefail
          bash tools/smoke-stage17-qemu.sh output-x64/ZonderqOS.iso stage17-qemu-serial.log 2>&1 | tee stage17-smoke.log
      - name: Diagnostics
        if: always()
        working-directory: zonderq
        run: |
          python3 - <<'PY' > stage17-symbols.log 2>&1
          import bisect
          import pathlib
          import re
          import subprocess

          elf = pathlib.Path('output-x64/ZonderqOS.elf')
          trace = pathlib.Path('stage17-qemu-serial.log.qemu-exceptions.log')
          print(f'ELF: {elf}')
          if not elf.is_file():
              print('[SMT17-SYMBOLS] ELF unavailable')
              raise SystemExit(0)

          nm = subprocess.run(
              ['nm', '-n', str(elf)], check=True, text=True,
              stdout=subprocess.PIPE).stdout
          symbols = []
          for line in nm.splitlines():
              fields = line.split(maxsplit=2)
              if len(fields) == 3 and re.fullmatch(r'[0-9a-fA-F]+', fields[0]):
                  symbols.append((int(fields[0], 16), fields[2]))

          addresses = []
          seen = set()
          if trace.is_file():
              for match in re.finditer(r'RIP=([0-9a-fA-F]{16})', trace.read_text(errors='replace')):
                  address = int(match.group(1), 16)
                  if address >= 0xffffffff80000000 and address not in seen:
                      seen.add(address)
                      addresses.append(address)
          else:
              print('[SMT17-SYMBOLS] QEMU exception trace unavailable')

          # Keep the tail because the dispatch fault is emitted after firmware noise.
          for address in addresses[-128:]:
              index = bisect.bisect_right(symbols, (address, chr(0x10ffff))) - 1
              nearest = '<no preceding symbol>'
              if index >= 0:
                  symbol_address, symbol_name = symbols[index]
                  nearest = f'{symbol_name}+0x{address - symbol_address:x}'
              print(f'\n===== 0x{address:016x} {nearest} =====')
              subprocess.run([
                  'addr2line', '-a', '-f', '-C', '-e', str(elf), f'0x{address:x}'])
              subprocess.run([
                  'objdump', '-d', '-C',
                  f'--start-address=0x{max(address - 32, 0):x}',
                  f'--stop-address=0x{address + 48:x}', str(elf)])
          PY
          tail -n 300 stage17-build.log 2>/dev/null || true
          cat stage17-qemu-serial.log stage17-qemu-serial.log.stderr 2>/dev/null || true
          cat stage17-symbols.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage17-diagnostics-Nehalem-${{ matrix.cpus }}cpu
          if-no-files-found: ignore
          path: |
            zonderq/stage17-*.log
            zonderq/stage17-qemu-serial.log.stderr
            zonderq/stage17-qemu-serial.log.qemu-exceptions.log
            zonderq/stage17-iso.sha256
