name: SMT stage 0-1 validation

on:
  push:
    branches: [ main ]
    paths:
      - 'patches/cosmos-smt/**'
      - 'tools/prepare-cosmos-smt.sh'
      - 'tools/smoke-stage01-qemu.sh'
      - 'ZonderqOS.csproj'
      - 'Bootloader/limine.conf'
      - '.github/workflows/smt-stage01.yml'
  pull_request:
    paths:
      - 'patches/cosmos-smt/**'
      - 'tools/prepare-cosmos-smt.sh'
      - 'tools/smoke-stage01-qemu.sh'
      - 'ZonderqOS.csproj'
      - 'Bootloader/limine.conf'
      - '.github/workflows/smt-stage01.yml'

jobs:
  validate-stage01:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout ZonderqOS
        uses: actions/checkout@v4
        with:
          path: zonderq

      - name: Checkout pinned Cosmos 3.0.85
        uses: actions/checkout@v4
        with:
          repository: CosmosOS/Cosmos
          ref: v3.0.85
          path: cosmos
          submodules: recursive

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install QEMU x64
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86
          qemu-system-x86_64 --version

      - name: Shell syntax
        run: |
          bash -n zonderq/tools/prepare-cosmos-smt.sh
          bash -n zonderq/tools/smoke-stage01-qemu.sh

      - name: Preflight stage 0-1 only
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 1 --check-only

      - name: Apply stage 1 only
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 1 --patch-only

      - name: Verify Limine MP protocol layout
        run: |
          grep -Fq 'LimineID ID = new(0x95a67b819a1b857e, 0xa0b61b723b6a73e0);' cosmos/src/Cosmos.Kernel.Boot.Limine/LimineMp.cs
          grep -Fq 'public readonly ulong Flags = 0;' cosmos/src/Cosmos.Kernel.Boot.Limine/LimineMp.cs
          grep -Fq 'public readonly uint BspLapicId;' cosmos/src/Cosmos.Kernel.Boot.Limine/LimineMp.cs
          grep -Fq 'public readonly ulong CpuCount;' cosmos/src/Cosmos.Kernel.Boot.Limine/LimineMp.cs
          grep -Fq 'public readonly LimineMpInfoX64** Cpus;' cosmos/src/Cosmos.Kernel.Boot.Limine/LimineMp.cs
          grep -Fq 'public delegate* unmanaged<LimineMpInfoX64*, void> GotoAddress;' cosmos/src/Cosmos.Kernel.Boot.Limine/LimineMp.cs
          grep -Fq 'public readonly ulong BspMpidr;' cosmos/src/Cosmos.Kernel.Boot.Limine/LimineMp.cs
          grep -Fq 'public readonly LimineMpInfoArm64** Cpus;' cosmos/src/Cosmos.Kernel.Boot.Limine/LimineMp.cs
          grep -Fq 'public delegate* unmanaged<LimineMpInfoArm64*, void> GotoAddress;' cosmos/src/Cosmos.Kernel.Boot.Limine/LimineMp.cs

      - name: Verify patch hygiene and stage isolation
        run: |
          git -C cosmos diff --check
          test -f cosmos/src/Cosmos.Kernel.Boot.Limine/LimineMp.cs
          grep -Fq 'public static readonly LimineMpRequest MP = new();' cosmos/src/Cosmos.Kernel.Boot.Limine/Limine.cs
          grep -Fq '[SMP] Stage 1 complete: MP response inspected; APs remain parked.' cosmos/src/Cosmos.Kernel.HAL.X64/X64PlatformInitializer.cs
          ! grep -Fq '_native_get_current_cpu_id' cosmos/src/Cosmos.Kernel.Native.X64/CPU/Interrupts.s
          grep -Fq '_context_switch_target_rsp: .zero 8' cosmos/src/Cosmos.Kernel.Native.X64/CPU/Interrupts.s
          ! grep -Fq '_context_switch_target_rsp: .zero 2048' cosmos/src/Cosmos.Kernel.Native.X64/CPU/Interrupts.s

      - name: Verify helper is idempotent at stage 1
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 1 --patch-only

      - name: Build patched x64 HAL
        working-directory: cosmos
        run: >-
          dotnet build src/Cosmos.Kernel.HAL.X64/Cosmos.Kernel.HAL.X64.csproj
          -c Release
          -r linux-x64
          -p:CosmosArch=x64
          -p:GeneratePackageOnBuild=false
          --no-incremental

      - name: Build Limine MP definitions for ARM64
        working-directory: cosmos
        run: >-
          dotnet build src/Cosmos.Kernel.Boot.Limine/Cosmos.Kernel.Boot.Limine.csproj
          -c Release
          -r linux-arm64
          -p:CosmosArch=arm64
          -p:GeneratePackageOnBuild=false
          --no-incremental

      - name: Build local patched Cosmos packages
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 1

      - name: Force ZonderqOS to restore patched Cosmos packages
        run: |
          cat > zonderq/NuGet.Config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="local-cosmos" value="${{ github.workspace }}/cosmos/artifacts/package/release" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local-cosmos">
                <package pattern="Cosmos.*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          rm -rf ~/.nuget/packages/cosmos.*

      - name: Build ZonderqOS x64 ISO from patched Cosmos
        working-directory: zonderq
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"
          cosmos build -a x64
          test -f output-x64/ZonderqOS.iso

      - name: QEMU boot smoke 4C/8T
        working-directory: zonderq
        env:
          STAGE01_QEMU_TIMEOUT_SECONDS: 75
        run: bash tools/smoke-stage01-qemu.sh output-x64/ZonderqOS.iso stage01-qemu-serial.log

      - name: Show QEMU serial log
        if: always()
        working-directory: zonderq
        run: |
          if [[ -f stage01-qemu-serial.log ]]; then
            echo '========== QEMU SERIAL =========='
            cat stage01-qemu-serial.log
          fi
