name: Audio Gen3 — real QEMU HDA PCM capture

on:
  pull_request:
    paths:
      - 'ZonderqOS.csproj'
      - 'Kernel.cs'
      - 'source/Core/Audio*.cs'
      - 'tools/build-cosmos-3095-local.sh'
      - 'tools/smoke-audio-qemu.py'
      - 'tools/verify-audio-wav-capture.py'
      - 'tools/verify-audio-stereo-capture.py'
      - 'tests/test_audio_stereo_validator.py'
      - 'tools/verify-audio-delay-capture.py'
      - 'tools/verify-audio-queue-capture.py'
      - 'tests/test_audio_queue_validator.py'
      - 'tests/test_audio_queue_dropout_diagnostics.py'
      - 'tools/analyze-audio-queue-dropouts.py'
      - 'tests/test_audio_hda_replay.py'
      - 'tools/analyze-audio-hda-replay.py'
      - 'tests/test_audio_delay_validator.py'
      - 'tools/verify-audio-volume-capture.py'
      - 'tools/verify-audio-mute-capture.py'
      - 'tools/verify-audio-balance-capture.py'
      - 'tests/test_audio_balance_validator.py'
      - 'tests/test_audio_fade_validator.py'
      - 'tools/verify-audio-fade-capture.py'
      - 'tests/test_audio_mute_validator.py'
      - 'tests/test_audio_wav_validator.py'
      - 'tests/test_audio_volume_validator.py'
      - 'tests/test_audio_qmp_keys.py'
      - '.github/workflows/audio-qemu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audio-qemu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hda-capture:
    name: Real ISO + 1 vCPU QEMU + non-silent WAV (no host disk)
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install pinned Cosmos and QEMU prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 tar clang lld nasm xorriso binutils qemu-system-x86
      - name: Check source and shell syntax
        run: |
          bash tools/verify-cosmos-3095-migration.sh
          bash -n run.sh tools/build-cosmos-3095-local.sh
          python3 tests/test_audio_queue_dropout_diagnostics.py
          python3 -m py_compile tools/analyze-audio-queue-dropouts.py tools/smoke-audio-qemu.py tools/verify-audio-wav-capture.py tools/verify-audio-stereo-capture.py tools/verify-audio-delay-capture.py tools/verify-audio-queue-capture.py tools/analyze-audio-hda-replay.py tools/verify-audio-volume-capture.py tools/verify-audio-mute-capture.py tools/verify-audio-balance-capture.py tools/verify-audio-fade-capture.py
          python3 tests/test_audio_gen3_contract.py
          python3 tests/test_audio_wav_validator.py
          python3 tests/test_audio_stereo_validator.py
          python3 tests/test_audio_delay_validator.py
          python3 tests/test_audio_queue_validator.py
          python3 tests/test_audio_hda_replay.py
          python3 tests/test_audio_volume_validator.py
          python3 tests/test_audio_mute_validator.py
          python3 tests/test_audio_qmp_keys.py
          python3 tests/test_audio_balance_validator.py
          python3 tests/test_audio_fade_validator.py
      - name: Build isolated stock Cosmos 3.0.95 AUDIO ISO
        env:
          ZONDERQ_3095_WORK_DIR: ${{ runner.temp }}/zonderqos-cosmos-3095
        run: |
          bash tools/build-cosmos-3095-local.sh audio
          test -s output-3095/ZonderqOS-3095-audio.iso
      - name: Boot and capture direct PCM tone
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-out --boot-seconds 45 --command tone
      - name: Boot and capture 20ms stereo PCM fade from actual HDA backend
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-fade-out --boot-seconds 45 --command tone --fade-ms 20
      - name: Boot and capture independent 440Hz left / 880Hz right stereo PCM
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-stereo-out --boot-seconds 45 --command stereosplit
      - name: Boot and capture two independently mixed PCM clips through stock HDA
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-mix-out --boot-seconds 45 --command mix
      - name: Boot and capture 50ms delayed independent PCM mixing
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-mixdelay-out --boot-seconds 45 --command mixdelay
      - name: Boot and verify three frame-scheduled PCM effects through HDA
        id: mixqueue
        # A failing timing-quality probe must not hide later independent
        # WAV format captures. Preserve the failure at the final gate.
        continue-on-error: true
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-mixqueue-out --boot-seconds 45 --command mixqueue
      - name: Quantify actual mixqueue dropouts without relaxing the strict quality gate
        if: always()
        run: |
          if [ -s audio-qemu-mixqueue-out/captured.wav ]; then
            python3 tools/analyze-audio-queue-dropouts.py audio-qemu-mixqueue-out/captured.wav
          else
            echo '[AUDIO-QUEUE-DIAG] no WAV artifact available; not a playback PASS'
          fi
      - name: Boot again and capture decoded in-memory RIFF/WAV playback
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-wav-out --boot-seconds 45 --command wavtone
      - name: Boot again and capture mono WAV decoded and upmixed to stereo
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-mono-out --boot-seconds 45 --command wavmono
      - name: Boot and capture resampled 44.1 kHz stereo WAV (880 Hz)
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-44100-out --boot-seconds 45 --command wav44
      - name: Boot and capture 8 kHz PCM8 mono voice-rate WAV (400 Hz)
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-8000-out --boot-seconds 45 --command wav8k
      - name: Boot and capture 11.025 kHz PCM8 mono voice-rate WAV (550 Hz)
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-11025-out --boot-seconds 45 --command wav11k
      - name: Boot and capture 16 kHz PCM8 mono voice-rate WAV (1500 Hz)
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-16000-out --boot-seconds 45 --command wav16k
      - name: Boot and capture 24 kHz PCM16 stereo WAV (740 Hz)
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-24000-out --boot-seconds 45 --command wav24k
      - name: Boot and capture resampled 22.05 kHz stereo WAV (1100 Hz)
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-22050-out --boot-seconds 45 --command wav22k
      - name: Boot and capture resampled 32 kHz stereo WAV (3520 Hz)
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-32000-out --boot-seconds 45 --command wav32k
      - name: Boot and capture resampled 32 kHz WAV with independent 440/880 Hz stereo
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-stereo32-out --boot-seconds 45 --command wavstereo32
      - name: Boot and capture unsigned PCM8 mono WAV converted to stereo PCM16 (1320 Hz)
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-pcm8-out --boot-seconds 45 --command wav8
      - name: Boot and capture signed PCM24 mono WAV converted to stereo PCM16 (1760 Hz)
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-pcm24-out --boot-seconds 45 --command wav24
      - name: Boot and capture signed PCM32 mono WAV converted to stereo PCM16 (2200 Hz)
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-pcm32-out --boot-seconds 45 --command wav32
      - name: Boot and capture WAVE_FORMAT_EXTENSIBLE PCM16 stereo (2640 Hz)
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-extensible-out --boot-seconds 45 --command wavext
      - name: Boot and capture WAVE_FORMAT_EXTENSIBLE 20 valid bits in PCM24 (3080 Hz)
        run: python3 tools/smoke-audio-qemu.py output-3095/ZonderqOS-3095-audio.iso audio-qemu-extensible20-out --boot-seconds 45 --command wavext20
      - name: Boot and capture right-only 880 Hz balance (left must be silent)
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-balance-out --boot-seconds 45 --command stereosplit --balance 100
      - name: Boot again at 25% software volume and compare actual output amplitude
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-quiet-out --boot-seconds 45 --command tone --volume 25
          python3 tools/verify-audio-volume-capture.py \
            audio-qemu-out/captured.wav audio-qemu-quiet-out/captured.wav
      - name: Boot once more at 0% software volume and require captured silence
        run: |
          python3 tools/smoke-audio-qemu.py \
            output-3095/ZonderqOS-3095-audio.iso audio-qemu-muted-out --boot-seconds 45 --command tone --volume 0
      - name: Enforce scheduled HDA queue quality gate
        if: always() && steps.mixqueue.outcome == 'failure'
        run: |
          echo "::error::mixqueue real QEMU PCM timing/quality verification failed; see captured.wav artifact"
          exit 1
      - name: Inspect potential 16KiB HDA ring replay (diagnostic, not IRQ proof)
        if: always()
        run: |
          for wav in audio-qemu-out/captured.wav audio-qemu-mixqueue-out/captured.wav; do
            if [ -s "$wav" ]; then
              python3 tools/analyze-audio-hda-replay.py "$wav"
            fi
          done
      - name: Diagnostic logs
        if: always()
        run: |
          tail -n 200 audio-qemu-out/serial.log audio-qemu-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-fade-out/serial.log audio-qemu-fade-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-stereo-out/serial.log audio-qemu-stereo-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-mix-out/serial.log audio-qemu-mix-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-mixdelay-out/serial.log audio-qemu-mixdelay-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-mixqueue-out/serial.log audio-qemu-mixqueue-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-wav-out/serial.log audio-qemu-wav-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-mono-out/serial.log audio-qemu-mono-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-44100-out/serial.log audio-qemu-44100-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-8000-out/serial.log audio-qemu-8000-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-11025-out/serial.log audio-qemu-11025-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-16000-out/serial.log audio-qemu-16000-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-24000-out/serial.log audio-qemu-24000-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-22050-out/serial.log audio-qemu-22050-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-32000-out/serial.log audio-qemu-32000-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-stereo32-out/serial.log audio-qemu-stereo32-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-pcm8-out/serial.log audio-qemu-pcm8-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-pcm24-out/serial.log audio-qemu-pcm24-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-pcm32-out/serial.log audio-qemu-pcm32-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-extensible-out/serial.log audio-qemu-extensible-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-extensible20-out/serial.log audio-qemu-extensible20-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-quiet-out/serial.log audio-qemu-quiet-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-muted-out/serial.log audio-qemu-muted-out/qemu.stderr.log 2>/dev/null || true
          tail -n 200 audio-qemu-balance-out/serial.log audio-qemu-balance-out/qemu.stderr.log 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-gen3-hda-qemu-diagnostics
          if-no-files-found: ignore
          path: |
            audio-qemu-out/*.log
            audio-qemu-out/*.wav
            audio-qemu-out/*.ppm
            audio-qemu-fade-out/*.log
            audio-qemu-fade-out/*.wav
            audio-qemu-fade-out/*.ppm
            audio-qemu-stereo-out/*.log
            audio-qemu-stereo-out/*.wav
            audio-qemu-stereo-out/*.ppm
            audio-qemu-mix-out/*.log
            audio-qemu-mix-out/*.wav
            audio-qemu-mix-out/*.ppm
            audio-qemu-mixdelay-out/*.log
            audio-qemu-mixdelay-out/*.wav
            audio-qemu-mixdelay-out/*.ppm
            audio-qemu-mixqueue-out/*.log
            audio-qemu-mixqueue-out/*.wav
            audio-qemu-mixqueue-out/*.ppm
            audio-qemu-wav-out/*.log
            audio-qemu-wav-out/*.wav
            audio-qemu-wav-out/*.ppm
            audio-qemu-mono-out/*.log
            audio-qemu-mono-out/*.wav
            audio-qemu-mono-out/*.ppm
            audio-qemu-44100-out/*.log
            audio-qemu-44100-out/*.wav
            audio-qemu-44100-out/*.ppm
            audio-qemu-8000-out/*.log
            audio-qemu-8000-out/*.wav
            audio-qemu-8000-out/*.ppm
            audio-qemu-11025-out/*.log
            audio-qemu-11025-out/*.wav
            audio-qemu-11025-out/*.ppm
            audio-qemu-16000-out/*.log
            audio-qemu-16000-out/*.wav
            audio-qemu-16000-out/*.ppm
            audio-qemu-24000-out/*.log
            audio-qemu-24000-out/*.wav
            audio-qemu-24000-out/*.ppm
            audio-qemu-22050-out/*.log
            audio-qemu-22050-out/*.wav
            audio-qemu-22050-out/*.ppm
            audio-qemu-32000-out/*.log
            audio-qemu-32000-out/*.wav
            audio-qemu-32000-out/*.ppm
            audio-qemu-stereo32-out/*.log
            audio-qemu-stereo32-out/*.wav
            audio-qemu-stereo32-out/*.ppm
            audio-qemu-pcm8-out/*.log
            audio-qemu-pcm8-out/*.wav
            audio-qemu-pcm8-out/*.ppm
            audio-qemu-pcm24-out/*.log
            audio-qemu-pcm24-out/*.wav
            audio-qemu-pcm24-out/*.ppm
            audio-qemu-pcm32-out/*.log
