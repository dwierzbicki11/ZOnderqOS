name: Cosmos v3.0.95 native SMP Stage1 real QEMU
on:
  pull_request:
    paths:
      - 'tools/port-cosmos-3095-stage1.py'
      - 'tools/build-cosmos-3095-local.sh'
      - 'tools/smoke-smp-3095-stage1-qemu.sh'
      - 'tests/verify_3095_native_stage1.py'
      - 'tests/test_3095_runtime_submodule_recovery.sh'
      - 'tests/test_3095_project_nuget_cache.py'
      - 'tools/repair-cosmos-3095-runtime-submodule.sh'
      - '.github/workflows/cosmos-3095-smp-stage1.yml'
      - 'ZonderqOS.csproj'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smp3095-native-stage1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-stage1-real-qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Exact 3.0.95 pins and Python/script checks
        run: |
          set -euo pipefail
          bash tools/verify-cosmos-3095-migration.sh
          python3 -m py_compile tools/port-cosmos-3095-stage1.py tests/verify_3095_native_stage1.py
          python3 tests/verify_3095_native_stage1.py --self-test
          python3 tests/verify_3095_managed_smp.py --self-test
          bash -n tools/repair-cosmos-3095-runtime-submodule.sh
          bash -n tests/test_3095_runtime_submodule_recovery.sh
          bash tests/test_3095_runtime_submodule_recovery.sh
          python3 tests/test_3095_project_nuget_cache.py
          bash -n tools/build-cosmos-3095-local.sh
          bash -n tools/smoke-smp-3095-stage1-qemu.sh
      - name: Install independent 3.0.95 build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 clang lld nasm xorriso binutils qemu-system-x86
      - name: Build instrumented exact-tag 3.0.95 isolated read-only probe ISO
        env:
          ZONDERQ_3095_NATIVE_STAGE1: 'true'
          ZONDERQ_3095_WORK_DIR: ${{ runner.temp }}/cosmos-3095-smp-probe
        run: |
          set -euo pipefail
          bash tools/build-cosmos-3095-local.sh probe
          test -s output-3095/ZonderqOS-3095-smp-stage1-probe.iso
          sha256sum output-3095/ZonderqOS-3095-smp-stage1-probe.iso
      - name: Actual 1-CPU QEMU guest serial evidence
        run: |
          bash tools/smoke-smp-3095-stage1-qemu.sh \
            output-3095/ZonderqOS-3095-smp-stage1-probe.iso \
            smp3095-stage1-1cpu.log 1
      - name: Actual 8-CPU QEMU guest serial evidence
        run: |
          bash tools/smoke-smp-3095-stage1-qemu.sh \
            output-3095/ZonderqOS-3095-smp-stage1-probe.iso \
            smp3095-stage1-8cpu.log 8
      - name: Upload guest serial logs (including failed boots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smp3095-native-stage1-serial
          if-no-files-found: ignore
          path: |
            smp3095-stage1-1cpu.log*
            smp3095-stage1-8cpu.log*
      - name: Upload native Stage1 proof ISO — QEMU ONLY
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zonderq3095-native-stage1-QEMU-ONLY
          path: output-3095/ZonderqOS-3095-smp-stage1-probe.iso
          retention-days: 4
