name: RAM runtime filesystems gate

on:
  push:
    branches: [ feature/devfs-runtime-v3 ]
    paths:
      - 'source/Core/RunFs.cs'
      - 'source/Core/TmpFs.cs'
      - 'source/Core/VirtualFs.cs'
      - 'source/Storage/Disk.cs'
      - 'source/Shell/Commands/CmdCd.cs'
      - 'source/Shell/Commands/CmdTouch.cs'
      - 'source/Shell/Commands/CmdRm.cs'
      - 'source/Shell/Commands/CmdCp.cs'
      - 'source/Shell/Commands/CmdMv.cs'
      - 'source/Shell/Commands/CmdMkdir.cs'
      - 'source/Shell/Commands/CmdRmdir.cs'
      - 'tests/RunFs.Tests/**'
      - 'tests/TmpFs.Tests/**'
      - '.github/workflows/runfs.yml'
  pull_request:
    paths:
      - 'source/Core/RunFs.cs'
      - 'source/Core/TmpFs.cs'
      - 'source/Core/VirtualFs.cs'
      - 'source/Storage/Disk.cs'
      - 'source/Shell/Commands/CmdCd.cs'
      - 'source/Shell/Commands/CmdTouch.cs'
      - 'source/Shell/Commands/CmdRm.cs'
      - 'source/Shell/Commands/CmdCp.cs'
      - 'source/Shell/Commands/CmdMv.cs'
      - 'source/Shell/Commands/CmdMkdir.cs'
      - 'source/Shell/Commands/CmdRmdir.cs'
      - 'tests/RunFs.Tests/**'
      - 'tests/TmpFs.Tests/**'
      - '.github/workflows/runfs.yml'

permissions:
  contents: read

jobs:
  runfs-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run deterministic RunFs tests
        run: dotnet run --project tests/RunFs.Tests/RunFs.Tests.csproj -c Release
      - name: Run deterministic TmpFs tests
        run: dotnet run --project tests/TmpFs.Tests/TmpFs.Tests.csproj -c Release
