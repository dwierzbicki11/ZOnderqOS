name: SMT stage 21 automatic AP load balancing

on:
  push:
    branches: [ main ]
    paths: [ 'patches/cosmos-smt/**', 'tools/prepare-cosmos-smt.sh', 'tools/smoke-stage12-qemu.sh', 'tools/smoke-stage14-qemu.sh', 'tools/smoke-stage19-qemu.sh', 'tools/smoke-stage20-qemu.sh', 'tools/smoke-stage21-qemu.sh', 'ZonderqOS.csproj', 'NuGet.Config', 'Bootloader/limine.conf', 'source/**', '.github/workflows/smt-stage21.yml' ]
  pull_request:
    paths: [ 'patches/cosmos-smt/**', 'tools/prepare-cosmos-smt.sh', 'tools/smoke-stage12-qemu.sh', 'tools/smoke-stage14-qemu.sh', 'tools/smoke-stage19-qemu.sh', 'tools/smoke-stage20-qemu.sh', 'tools/smoke-stage21-qemu.sh', 'ZonderqOS.csproj', 'NuGet.Config', 'Bootloader/limine.conf', 'source/**', '.github/workflows/smt-stage21.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-stage21:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpus: 1
            cores: 1
            threads: 1
          - cpus: 8
            cores: 4
            threads: 2
    steps:
      - uses: actions/checkout@v4
        with: { path: zonderq }
      - uses: actions/checkout@v4
        with:
          repository: CosmosOS/Cosmos
          ref: v3.0.85
          path: cosmos
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Install native toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 lld xorriso nasm binutils
          qemu-system-x86_64 --version
      - name: Validate and apply Stage 21
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: |
          set -o pipefail
          bash -n zonderq/tools/prepare-cosmos-smt.sh
          bash -n zonderq/tools/smoke-stage21-qemu.sh
          bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 21 --check-only 2>&1 | tee zonderq/stage21-preflight.log
          bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 21 --patch-only 2>&1 | tee zonderq/stage21-apply.log
          git -C cosmos apply --reverse --check ../zonderq/patches/cosmos-smt/0021-automatic-load-balancing.patch
          sed -E 's,//.*$,,' cosmos/src/Cosmos.Kernel.Native.X64/CPU/Interrupts.s | as --64 -o /tmp/stage21-interrupts.o -
          git -C cosmos diff --check
      - name: Verify idempotence and build patched Cosmos packages
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: |
          set -o pipefail
          bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 21 2>&1 | tee zonderq/stage21-packages.log
      - name: ARM64 managed regression compile
        if: matrix.cpus == 1
        working-directory: cosmos
        run: |
          set -o pipefail
          dotnet build src/Cosmos.Kernel.HAL/Cosmos.Kernel.HAL.csproj -c Release -r linux-arm64 -p:CosmosArch=arm64 -p:GeneratePackageOnBuild=false --no-incremental 2>&1 | tee ../zonderq/stage21-arm64-hal.log
          dotnet build src/Cosmos.Kernel.HAL.ARM64/Cosmos.Kernel.HAL.ARM64.csproj -c Release -r linux-arm64 -p:CosmosArch=arm64 -p:GeneratePackageOnBuild=false --no-incremental 2>&1 | tee ../zonderq/stage21-arm64-platform.log
          echo 'ARM64 managed compile only; no ARM64 SMP/runtime claim.'
      - name: Force local patched Cosmos packages
        run: |
          cat > zonderq/NuGet.Config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources><clear /><add key="local-cosmos" value="${{ github.workspace }}/cosmos/artifacts/package/release" /><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources>
            <packageSourceMapping><packageSource key="local-cosmos"><package pattern="Cosmos.*" /></packageSource><packageSource key="nuget.org"><package pattern="*" /></packageSource></packageSourceMapping>
          </configuration>
          EOF
          mkdir -p "${{ runner.temp }}/zonderq-stage21-packages"
      - name: Build real ZonderqOS x64 ISO
        working-directory: zonderq
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/zonderq-stage21-packages
          LOCAL_COSMOS_FEED: ${{ github.workspace }}/cosmos/artifacts/package/release
        run: |
          set -o pipefail
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet restore ZonderqOS.csproj -r linux-x64 -p:CosmosArch=x64 --configfile NuGet.Config --force --no-cache 2>&1 | tee stage21-restore.log
          python3 - <<'PY' | tee stage21-package-sources.log
          import json
          import os
          import pathlib

          cache = pathlib.Path(os.environ['NUGET_PACKAGES'])
          feed = pathlib.Path(os.environ['LOCAL_COSMOS_FEED']).resolve()
          required = {'cosmos.sdk', 'cosmos.kernel', 'cosmos.kernel.core', 'cosmos.kernel.core.x64', 'cosmos.kernel.hal', 'cosmos.kernel.hal.x64', 'cosmos.kernel.native.x64', 'cosmos.kernel.boot.limine'}
          found = set()
          for metadata in sorted(cache.glob('cosmos.*/3.0.85/.nupkg.metadata')):
              package = metadata.parent.parent.name
              source = json.loads(metadata.read_text())['source']
              if pathlib.Path(source).resolve() != feed:
                  raise SystemExit(f'[SMT21-CI][FAIL] {package} restored from {source}, expected {feed}')
              found.add(package)
          if required - found:
              raise SystemExit(f'[SMT21-CI][FAIL] missing local package metadata: {sorted(required - found)}')
          PY
          cosmos build -a x64 -v 2>&1 | tee stage21-build.log
          test -s output-x64/ZonderqOS.iso
          sha256sum output-x64/ZonderqOS.iso | tee stage21-iso.sha256
      - name: QEMU Stage 0-20 regression plus Stage 21 balancing
        working-directory: zonderq
        env:
          STAGE21_QEMU_CPU_MODEL: Nehalem
          STAGE21_QEMU_SOCKETS: 1
          STAGE21_QEMU_CPUS: ${{ matrix.cpus }}
          STAGE21_QEMU_CORES: ${{ matrix.cores }}
          STAGE21_QEMU_THREADS: ${{ matrix.threads }}
          STAGE21_QEMU_TIMEOUT_SECONDS: 105
          STAGE21_QEMU_STABLE_SECONDS: 30
        run: |
          set -o pipefail
          bash tools/smoke-stage21-qemu.sh output-x64/ZonderqOS.iso stage21-qemu-serial.log 2>&1 | tee stage21-smoke.log
      - name: Diagnostics
        if: always()
        working-directory: zonderq
        run: |
          tail -n 300 stage21-build.log 2>/dev/null || true
          cat stage21-qemu-serial.log stage21-qemu-serial.log.stderr 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage21-diagnostics-Nehalem-${{ matrix.cpus }}cpu
          if-no-files-found: ignore
          path: |
            zonderq/stage21-*.log
            zonderq/stage21-qemu-serial.log.stderr
            zonderq/stage21-qemu-serial.log.qemu-exceptions.log
            zonderq/stage21-iso.sha256
