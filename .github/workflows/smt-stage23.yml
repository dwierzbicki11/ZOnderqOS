name: SMT stage 23 production all-CPU scheduling

on:
  push:
    branches: [ main, 'smp/stage23-production-all-cpus' ]
    paths: [ 'patches/cosmos-smt/**', 'tools/prepare-cosmos-smt.sh', 'tools/smoke-stage20-qemu.sh', 'tools/smoke-stage21-qemu.sh', 'tools/smoke-stage22-qemu.sh', 'tools/smoke-stage23-qemu.sh', 'Kernel.cs', 'ZonderqOS.csproj', 'NuGet.Config', 'Bootloader/limine.conf', 'source/**', '.github/workflows/smt-stage23.yml' ]
  pull_request:
    paths: [ 'patches/cosmos-smt/**', 'tools/prepare-cosmos-smt.sh', 'tools/smoke-stage20-qemu.sh', 'tools/smoke-stage21-qemu.sh', 'tools/smoke-stage22-qemu.sh', 'tools/smoke-stage23-qemu.sh', 'Kernel.cs', 'ZonderqOS.csproj', 'NuGet.Config', 'Bootloader/limine.conf', 'source/**', '.github/workflows/smt-stage23.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-stage23:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - cpus: 1
            cores: 1
            threads: 1
          - cpus: 2
            cores: 2
            threads: 1
          - cpus: 4
            cores: 4
            threads: 1
          - cpus: 4
            cores: 2
            threads: 2
          - cpus: 8
            cores: 8
            threads: 1
          - cpus: 8
            cores: 4
            threads: 2
          - cpus: 16
            cores: 8
            threads: 2

    steps:
      - uses: actions/checkout@v4
        with: { path: zonderq }

      - uses: actions/checkout@v4
        with:
          repository: CosmosOS/Cosmos
          ref: v3.0.85
          path: cosmos
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }

      - name: Install native toolchain and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 lld xorriso nasm binutils
          qemu-system-x86_64 --version

      - name: Validate and apply Stage 23
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: |
          set -o pipefail
          bash -n zonderq/tools/prepare-cosmos-smt.sh
          bash -n zonderq/tools/smoke-stage23-qemu.sh
          bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 23 --check-only 2>&1 | tee zonderq/stage23-preflight.log
          bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 23 --patch-only 2>&1 | tee zonderq/stage23-apply.log
          git -C cosmos apply --reverse --check ../zonderq/patches/cosmos-smt/0023-production-managed-smp.patch
          sed -E 's,//.*$,,' cosmos/src/Cosmos.Kernel.Native.X64/CPU/Interrupts.s | as --64 -o /tmp/stage23-interrupts.o -
          git -C cosmos diff --check

      - name: Verify idempotence and build patched Cosmos packages
        env:
          ZONDERQ_COSMOS_SOURCE_ROOT: ${{ github.workspace }}/cosmos
        run: |
          set -o pipefail
          bash zonderq/tools/prepare-cosmos-smt.sh --through-stage 23 2>&1 | tee zonderq/stage23-packages.log

      - name: ARM64 managed regression compile
        if: matrix.cpus == 1
        working-directory: cosmos
        run: |
          set -o pipefail
          dotnet build src/Cosmos.Kernel.HAL/Cosmos.Kernel.HAL.csproj -c Release -r linux-arm64 -p:CosmosArch=arm64 -p:GeneratePackageOnBuild=false --no-incremental 2>&1 | tee ../zonderq/stage23-arm64-hal.log
          dotnet build src/Cosmos.Kernel.HAL.ARM64/Cosmos.Kernel.HAL.ARM64.csproj -c Release -r linux-arm64 -p:CosmosArch=arm64 -p:GeneratePackageOnBuild=false --no-incremental 2>&1 | tee ../zonderq/stage23-arm64-platform.log
          dotnet build src/Cosmos.Kernel.Core/Cosmos.Kernel.Core.csproj -c Release -r linux-arm64 -p:CosmosArch=arm64 -p:GeneratePackageOnBuild=false --no-incremental 2>&1 | tee ../zonderq/stage23-arm64-core.log
          echo 'ARM64 managed compile only; production SMP activation remains x64-only.'

      - name: Force local patched Cosmos packages
        run: |
          cat > zonderq/NuGet.Config <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources><clear /><add key="local-cosmos" value="${{ github.workspace }}/cosmos/artifacts/package/release" /><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources>
            <packageSourceMapping><packageSource key="local-cosmos"><package pattern="Cosmos.*" /></packageSource><packageSource key="nuget.org"><package pattern="*" /></packageSource></packageSourceMapping>
          </configuration>
          EOF
          mkdir -p "${{ runner.temp }}/zonderq-stage23-packages"

      - name: Build real ZonderqOS x64 ISO
        working-directory: zonderq
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/zonderq-stage23-packages
          LOCAL_COSMOS_FEED: ${{ github.workspace }}/cosmos/artifacts/package/release
        run: |
          set -o pipefail
          export PATH="$HOME/.dotnet/tools:$PATH"
          dotnet restore ZonderqOS.csproj -r linux-x64 -p:CosmosArch=x64 --configfile NuGet.Config --force --no-cache 2>&1 | tee stage23-restore.log
          python3 - <<'PY' | tee stage23-package-sources.log
          import json
          import os
          import pathlib

          cache = pathlib.Path(os.environ['NUGET_PACKAGES'])
          feed = pathlib.Path(os.environ['LOCAL_COSMOS_FEED']).resolve()
          required = {
              'cosmos.sdk', 'cosmos.kernel', 'cosmos.kernel.core',
              'cosmos.kernel.core.x64', 'cosmos.kernel.hal',
              'cosmos.kernel.hal.x64', 'cosmos.kernel.native.x64',
              'cosmos.kernel.boot.limine'
          }
          found = set()
          for metadata in sorted(cache.glob('cosmos.*/3.0.85/.nupkg.metadata')):
              package = metadata.parent.parent.name
              source = json.loads(metadata.read_text())['source']
              if pathlib.Path(source).resolve() != feed:
                  raise SystemExit(
                      f'[SMT23-CI][FAIL] {package} restored from {source}, expected {feed}')
              found.add(package)
          if required - found:
              raise SystemExit(
                  f'[SMT23-CI][FAIL] missing local package metadata: {sorted(required - found)}')
          PY
          cosmos build -a x64 -v 2>&1 | tee stage23-build.log
          test -s output-x64/ZonderqOS.iso
          sha256sum output-x64/ZonderqOS.iso | tee stage23-iso.sha256

      - name: QEMU Stage 0-22 regression plus production all-CPU managed scheduling
        working-directory: zonderq
        env:
          STAGE23_QEMU_CPU_MODEL: Nehalem
          STAGE23_QEMU_SOCKETS: 1
          STAGE23_QEMU_CPUS: ${{ matrix.cpus }}
          STAGE23_QEMU_CORES: ${{ matrix.cores }}
          STAGE23_QEMU_THREADS: ${{ matrix.threads }}
          STAGE23_QEMU_TIMEOUT_SECONDS: 210
          STAGE23_QEMU_STABLE_SECONDS: 60
        run: |
          set -o pipefail
          bash tools/smoke-stage23-qemu.sh output-x64/ZonderqOS.iso stage23-qemu-serial.log 2>&1 | tee stage23-smoke.log

      - name: Diagnostics
        if: always()
        working-directory: zonderq
        run: |
          tail -n 350 stage23-build.log 2>/dev/null || true
          cat stage23-qemu-serial.log stage23-qemu-serial.log.stderr 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage23-diagnostics-Nehalem-${{ matrix.cpus }}cpu
          if-no-files-found: ignore
          path: |
            zonderq/stage23-*.log
            zonderq/stage23-qemu-serial.log.stderr
            zonderq/stage23-qemu-serial.log.qemu-exceptions.log
            zonderq/stage23-iso.sha256
