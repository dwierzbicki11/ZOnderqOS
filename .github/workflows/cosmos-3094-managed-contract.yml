name: Cosmos 3.0.94 managed SMP production contract

on:
  push:
    branches: [main]
    paths:
      - 'tools/verify-cosmos-3094-managed-smp-contract.py'
      - 'tests/Cosmos3094SmpBoot/**'
      - 'patches/cosmos-3094/**'
      - '.github/workflows/cosmos-3094-managed-contract.yml'
  pull_request:
    paths:
      - 'tools/verify-cosmos-3094-managed-smp-contract.py'
      - 'tests/Cosmos3094SmpBoot/**'
      - 'patches/cosmos-3094/**'
      - '.github/workflows/cosmos-3094-managed-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-managed-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject forged SMP Stage 23 evidence
        run: |
          set -euo pipefail
          bash tools/verify-cosmos-compat.sh
          python3 tools/verify-cosmos-3094-managed-smp-contract.py --self-test
      - name: Confirm Cosmos 3.0.94 managed SMP port is not falsely marked complete
        run: |
          set -euo pipefail
          test -f patches/cosmos-3094/0009-ap-timer-readiness.patch
          # No 3.0.85 production patches may be treated as Cosmos 3.0.94 proof.
          ! grep -R -n -E 'SMP3094-MANAGED-STAGE23.*PASS' patches/cosmos-3094/
          echo '[SMP3094-CONTRACT] PASS: no false Stage23 success in native-only patches'
