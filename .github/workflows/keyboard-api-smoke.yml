name: Cosmos 3.0.95 keyboard and stock runtime contract
on:
  push:
    branches: [main]
    paths:
      - 'source/Common/CosmosKeyboardApiCompat.cs'
      - 'ZonderqOS.csproj'
      - 'run.sh'
      - 'tests/KeyboardApiSmoke/**'
      - '.github/workflows/keyboard-api-smoke.yml'
  pull_request:
    paths:
      - 'source/Common/CosmosKeyboardApiCompat.cs'
      - 'ZonderqOS.csproj'
      - 'run.sh'
      - 'tests/KeyboardApiSmoke/**'
      - '.github/workflows/keyboard-api-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version and keyboard API inputs
        run: |
          set -euo pipefail
          bash run.sh --check
          grep -Fq 'CosmosApiTestVersion' tests/KeyboardApiSmoke/KeyboardApiSmoke.csproj
          grep -Fq '>3.0.95</CosmosApiTestVersion>' tests/KeyboardApiSmoke/KeyboardApiSmoke.csproj
          # Exact-tag keyboard contract is compiled by cosmos-3095-migration.yml.
