name: Network stage N3 ARP
on:
  pull_request:
    paths: ['Kernel.cs','source/Core/ArpStageProbe.cs','source/Core/NetworkN3Kernel.cs','source/Core/NetworkN3EntryKernel.cs','ZonderqOS.csproj','tools/network-stage-n3-qemu.sh','patches/network-n2/**','.github/workflows/network-stage-n3.yml']
  workflow_dispatch:
jobs:
  validate-network-n3:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y qemu-system-x86 lld xorriso nasm
          dotnet tool install --global Cosmos.Patcher --version 3.0.85
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Prepare Cosmos with verified raw RX hook
        run: |
          set -o pipefail; unset ZONDERQ_COSMOS_SOURCE_ROOT
          bash tools/prepare-cosmos-smt.sh --all 2>&1 | tee network-n3-cosmos.log
          COSMOS_ROOT="$(cd "$GITHUB_WORKSPACE/.." && pwd)/Cosmos"; COSMOS_FEED="$COSMOS_ROOT/artifacts/package/release"
          git -C "$COSMOS_ROOT" apply --check "$GITHUB_WORKSPACE/patches/network-n2/0001-network-manager-raw-rx-probe.patch"
          git -C "$COSMOS_ROOT" apply "$GITHUB_WORKSPACE/patches/network-n2/0001-network-manager-raw-rx-probe.patch"
          ( cd "$COSMOS_ROOT"; export VersionPrefix=3.0.85
            dotnet restore src/Cosmos.Kernel.System/Cosmos.Kernel.System.csproj -p:VersionPrefix=3.0.85 --force --no-cache
            dotnet build src/Cosmos.Kernel.System/Cosmos.Kernel.System.csproj -c Release -p:VersionPrefix=3.0.85 --no-restore
            dotnet restore src/Cosmos.Kernel.System/Cosmos.Kernel.System.csproj -r linux-x64 -p:VersionPrefix=3.0.85 --force --no-cache
            dotnet build src/Cosmos.Kernel.System/Cosmos.Kernel.System.csproj -c Release -r linux-x64 -p:VersionPrefix=3.0.85 --no-restore
            mkdir -p artifacts/multiarch/Cosmos.Kernel.System/x64; cp artifacts/bin/Cosmos.Kernel.System/release_linux-x64/Cosmos.Kernel.System.dll artifacts/multiarch/Cosmos.Kernel.System/x64/
            dotnet restore src/Cosmos.Kernel.System/Cosmos.Kernel.System.csproj -r linux-arm64 -p:VersionPrefix=3.0.85 --force --no-cache
            dotnet build src/Cosmos.Kernel.System/Cosmos.Kernel.System.csproj -c Release -r linux-arm64 -p:VersionPrefix=3.0.85 --no-restore
            mkdir -p artifacts/multiarch/Cosmos.Kernel.System/arm64; cp artifacts/bin/Cosmos.Kernel.System/release_linux-arm64/Cosmos.Kernel.System.dll artifacts/multiarch/Cosmos.Kernel.System/arm64/
            dotnet pack src/Cosmos.Kernel.System/Cosmos.Kernel.System.csproj -c Release -p:VersionPrefix=3.0.85 -o "$COSMOS_FEED" --no-build ) 2>&1 | tee -a network-n3-cosmos.log
      - name: Build isolated x64 N3 probe ISO
        run: |
          set -o pipefail; COSMOS_ROOT="$(cd "$GITHUB_WORKSPACE/.." && pwd)/Cosmos"; COSMOS_FEED="$COSMOS_ROOT/artifacts/package/release"; CACHE="$GITHUB_WORKSPACE/.nuget/network-n3-packages"
          rm -rf "$CACHE" obj bin; mkdir -p "$CACHE"
          cat > network-n3-nuget.config <<EOF
          <?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear/><add key="local-cosmos" value="$COSMOS_FEED"/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources><packageSourceMapping><packageSource key="local-cosmos"><package pattern="Cosmos.*"/></packageSource><packageSource key="nuget.org"><package pattern="*"/></packageSource></packageSourceMapping></configuration>
          EOF
          NUGET_PACKAGES="$CACHE" dotnet restore ZonderqOS.csproj -r linux-x64 -p:CosmosArch=x64 -p:CosmosNetworkStageN3=true --configfile network-n3-nuget.config --force --no-cache 2>&1 | tee network-n3-restore.log
          RESTORED_SYSTEM="$CACHE/cosmos.kernel.system/3.0.85/runtimes/linux-x64/lib/net10.0/Cosmos.Kernel.System.dll"; test -f "$RESTORED_SYSTEM"; strings "$RESTORED_SYSTEM" | grep -Fq SetRawReceiveHandler
          NUGET_PACKAGES="$CACHE" dotnet build ZonderqOS.csproj -c Release -r linux-x64 -p:CosmosArch=x64 -p:CosmosNetworkStageN3=true -p:NetworkN2CosmosKernelSystemPath="$RESTORED_SYSTEM" --no-restore 2>&1 | tee network-n3-build.log
          ISO="$(find bin -type f \( -name 'ZonderqOS.iso' -o -name '*.iso' \) | head -n 1)"; test -n "$ISO" && test -f "$ISO"; cp "$ISO" network-n3-x64.iso; echo "ZONDERQ_ISO=$GITHUB_WORKSPACE/network-n3-x64.iso" >> "$GITHUB_ENV"
      - name: QEMU ARP request reply and resolution proof
        run: bash tools/network-stage-n3-qemu.sh
      - name: Upload N3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-n3-arp-evidence
          path: |
            network-n3-cosmos.log
            network-n3-restore.log
            network-n3-build.log
            network-n3-qemu.log
            network-n3.pcap
          if-no-files-found: ignore
