name: Cosmos v3.0.95 SMP Stage3 BSP GS and stacks
on:
  pull_request:
    paths:
      - 'tools/port-cosmos-3095-stage1.py'
      - 'tools/port-cosmos-3095-stage2.py'
      - 'tools/port-cosmos-3095-stage3.py'
      - 'tools/build-cosmos-3095-local.sh'
      - 'tools/smoke-smp-3095-stage1-qemu.sh'
      - 'tests/verify_3095_native_stage1.py'
      - 'tests/test_3095_runtime_object_reuse.sh'
      - '.github/workflows/cosmos-3095-smp-stage3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smp3095-native-stage3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-stage3-real-qemu:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate exact-tag scripts and negative evidence
        run: |
          set -euo pipefail
          bash tools/verify-cosmos-3095-migration.sh
          python3 -m py_compile tools/port-cosmos-3095-stage1.py tools/port-cosmos-3095-stage2.py tools/port-cosmos-3095-stage3.py tests/verify_3095_native_stage1.py
          python3 tests/verify_3095_native_stage1.py --self-test
          bash -n tests/test_3095_runtime_object_reuse.sh
          bash tests/test_3095_runtime_object_reuse.sh
          bash -n tools/build-cosmos-3095-local.sh
          bash -n tools/smoke-smp-3095-stage1-qemu.sh
      - name: Install Cosmos build and QEMU dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld nasm xorriso binutils qemu-system-x86
      - name: Build strictly isolated exact-tag Stage3 probe
        env:
          ZONDERQ_3095_NATIVE_STAGE1: 'true'
          ZONDERQ_3095_NATIVE_STAGE2: 'true'
          ZONDERQ_3095_NATIVE_STAGE3: 'true'
          ZONDERQ_3095_WORK_DIR: ${{ runner.temp }}/cosmos-3095-smp-stage2
        run: |
          bash tools/build-cosmos-3095-local.sh probe
          test -s output-3095/ZonderqOS-3095-smp-stage3-probe.iso
      - name: QEMU 1 CPU — native Stage3 mapping
        env:
          ZONDERQ_3095_REQUIRE_GS: 'true'
        run: |
          bash tools/smoke-smp-3095-stage1-qemu.sh \
            output-3095/ZonderqOS-3095-smp-stage3-probe.iso \
            smp3095-stage3-1cpu.log 1
      - name: QEMU 8 CPUs — native Stage3 mapping
        env:
          ZONDERQ_3095_REQUIRE_GS: 'true'
        run: |
          bash tools/smoke-smp-3095-stage1-qemu.sh \
            output-3095/ZonderqOS-3095-smp-stage3-probe.iso \
            smp3095-stage3-8cpu.log 8
      - name: Preserve real serial evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smp3095-stage3-real-serial
          if-no-files-found: ignore
          path: |
            smp3095-stage3-1cpu.log*
            smp3095-stage3-8cpu.log*
