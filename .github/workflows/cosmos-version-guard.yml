name: Cosmos 3.0.95 stock upstream and SMP-free guard
on:
  push:
    branches: [main]
    paths:
      - 'ZonderqOS.csproj'
      - 'run.sh'
      - 'tools/build-cosmos-3095-local.sh'
      - 'tools/verify-cosmos-compat.sh'
      - 'tools/verify-cosmos-3095-migration.sh'
      - 'tests/test_upstream_smp_disabled.py'
      - '.github/workflows/cosmos-version-guard.yml'
  pull_request:
    paths:
      - 'ZonderqOS.csproj'
      - 'run.sh'
      - 'tools/build-cosmos-3095-local.sh'
      - 'tools/verify-cosmos-compat.sh'
      - 'tests/test_upstream_smp_disabled.py'
      - '.github/workflows/cosmos-version-guard.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stock-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate launcher and pinned runtime
        run: |
          set -euo pipefail
          bash -n run.sh tools/verify-cosmos-compat.sh tools/verify-cosmos-3095-migration.sh tools/build-cosmos-3095-local.sh
          bash run.sh --check
          python3 tests/test_upstream_smp_disabled.py
