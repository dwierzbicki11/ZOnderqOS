name: Cosmos patched runtime version guard

on:
  push:
    branches: [ main ]
    paths:
      - ZonderqOS.csproj
      - run.sh
      - run-core.sh
      - tools/prepare-cosmos-smt.sh
      - tools/verify-cosmos-compat.sh
      - .github/workflows/smt-stage22.yml
      - .github/workflows/smt-stage23.yml
      - .github/workflows/cosmos-version-guard.yml
  pull_request:
    paths:
      - ZonderqOS.csproj
      - run.sh
      - run-core.sh
      - tools/prepare-cosmos-smt.sh
      - tools/verify-cosmos-compat.sh
      - .github/workflows/smt-stage22.yml
      - .github/workflows/smt-stage23.yml
      - .github/workflows/cosmos-version-guard.yml
  workflow_dispatch:

jobs:
  validate-patched-cosmos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell guard and SMT launcher syntax
        run: |
          bash -n tools/verify-cosmos-compat.sh
          bash -n run-core.sh
      - name: Enforce SDK/runtime/CI release alignment
        run: bash tools/verify-cosmos-compat.sh
